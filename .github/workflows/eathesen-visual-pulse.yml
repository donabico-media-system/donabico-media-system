name: Eathesen V3000 Visual Asset Renderer (Cloudflare Edge AI)

on:
  schedule:
    - cron: '30 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-visual-assets:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Render & Publish Cover Artwork (FLUX.1-schnell)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository & CDN Index
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install --quiet requests huggingface_hub

      - name: Execute Autonomous Visual Renderer
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CLASSIC_API_TOKEN: ${{ secrets.CLASSIC_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/eathesen_image_renderer.py

      - name: Publish Rendered WebP Assets
        run: |
          git config user.name "donabico-media-system"
          git config user.email "support@donabicomedia.com"
          # Thêm cả thư mục cdn và assets (nếu có)
          git add cdn/ assets/ 2>/dev/null || git add cdn/
          if git diff --staged --quiet; then
            echo "No visual assets to publish."
          else
            git commit -m "chore(visual): [¢24] render pulse $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            # Kéo code mới nhất và tự động ưu tiên code vừa chạy (-X ours)
            git pull origin main --no-rebase -X ours
            git push origin main
          fi