name: Eathesen V3000 Visual Asset Renderer (Cloudflare Edge AI)

on:
  schedule:
    - cron: '30 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write  # <-- Đã sửa từ read thành write

jobs:
  render-visual-assets:
    name: Render & Publish Cover Artwork (FLUX.1-schnell)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository & CDN Index
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # <-- Bổ sung fetch-depth để hỗ trợ git pull/push

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install --quiet requests huggingface_hub

      - name: Execute Autonomous Visual Renderer
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/eathesen_image_renderer.py

      - name: Publish & Broadcast Visual State (HTTP 200 OK)
        run: |
          git config user.name "donabico-media-system"
          git config user.email "support@donabicomedia.com"
          git add .
          if git diff --staged --quiet; then
            echo "No visual state changes detected."
          else
            git commit -m "chore(visual): [¢24] donabico-media-system Visual Asset Broadcast $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase -X ours origin main
            git push origin main
          fi
