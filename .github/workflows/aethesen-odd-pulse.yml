name: AETHESEN V3000 - Odd Parity Pulse (donabico-media-system)

on:
  schedule:
    - cron: '0 2,6,10,14,18,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  odd-parity-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout donabico-media-system Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CLASSIC_API_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Audit Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy

      - name: Sync Latest Branch Before Execution
        env:
          CLASSIC_API_TOKEN: ${{ secrets.CLASSIC_API_TOKEN }}
        run: |
          git config user.name "donabico-media-system"
          git config user.email "support@donabicomedia.com"
          git pull --rebase "https://x-access-token:${CLASSIC_API_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ${GITHUB_REF_NAME}

      - name: Execute Odd-Parity Discovery, Entropy Audit & Groq Distillation
        env:
          PARITY_MODE: "ODD"
          GITHUB_ORG: "donabico-media-system"
          HF_AUTHOR: "donabico"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CLASSIC_API_TOKEN: ${{ secrets.CLASSIC_API_TOKEN }}
        run: |
          python scripts/aethesen_orchestrator.py

      - name: Publish & Broadcast CDN Feed (HTTP 200 OK)
        env:
          CLASSIC_API_TOKEN: ${{ secrets.CLASSIC_API_TOKEN }}
        run: |
          git config user.name "donabico-media-system"
          git config user.email "support@donabicomedia.com"
          git add cdn/
          if git diff --staged --quiet; then
            echo "[INFO] No new parity changes detected. Skipping commit."
          else
            git commit -m "chore(cdn): [¢24] donabico-media-system Odd-Parity Broadcast $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull -s recursive -X ours "https://x-access-token:${CLASSIC_API_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ${GITHUB_REF_NAME} --no-edit
            git push "https://x-access-token:${CLASSIC_API_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
          fi
