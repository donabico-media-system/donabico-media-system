name: Eathesen V3000 Odd-Parity Pulse (10K-Scale CDN)

on:
  schedule:
    - cron: '0 2,6,10,14,18,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  odd-parity-orchestrator:
    name: Odd-Parity Discovery, Entropy Audit & Cloudflare Edge Distillation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository & Incremental CDN Cache
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install --quiet requests

      - name: Execute Odd-Parity Discovery, Entropy Audit & Edge Distillation
        env:
          HF_TOKEN: \${{ secrets.HF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/eathesen_orchestrator.py --parity ODD

      - name: Publish & Broadcast CDN Feed (HTTP 200 OK)
        run: |
          git config user.name "donabico-media-system"
          git config user.email "support@donabicomedia.com"
          git add cdn/
          if git diff --staged --quiet; then
            echo "No CDN changes detected."
          else
            git commit -m "chore(cdn): [¢24] donabico-media-system Odd-Parity Broadcast \$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase -X ours origin main
            git push origin main
          fi
