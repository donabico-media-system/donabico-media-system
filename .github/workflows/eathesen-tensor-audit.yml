name: Eathesen V3000 Daily Tensor & Entropy Audit

on:
  schedule:
    - cron: '15 5 * * *' # Chạy vào 5:15 sáng mỗi ngày
  workflow_dispatch:

permissions:
  contents: read # Chỉ cần quyền đọc dữ liệu

jobs:
  tensor-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Deep Entropy & Tensor Variance Verification (Entropy = 0)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Deep Tensor Audit Script
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/eathesen_tensor_audit.py